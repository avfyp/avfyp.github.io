<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVFYP ADMIN PAGE</title>
<link rel="icon" type="image/png" href="/admin/thumbnail/favicon/avfyp.png">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#0d0d0d;color:#fff}body{display:flex;align-items:center;justify-content:center;padding:20px}.box{width:100%;max-width:380px;background:#151515;border:1px solid #292929;border-radius:14px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.35)}h1{margin:0 0 8px;font-size:24px}p{margin:0 0 18px;color:#999}.row{display:flex;gap:8px}input{width:100%;padding:13px 14px;border:1px solid #333;border-radius:9px;background:#0d0d0d;color:#fff;font-size:16px;outline:none}button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:9px;background:#fff;color:#000;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{margin-top:14px;font-size:14px;color:#aaa;min-height:20px}.error{color:#ff7777}.back{display:block;margin-top:16px;text-align:center;color:#888;text-decoration:none;font-size:13px}.back:hover{color:#fff}</style>
</head>
<body>
<div class="box">
<h1>AVFYP Admin</h1>
<p>Ini fitur ADMIN, masukan password untuk membuka hlaman panel. Jika anda bukan ADMIN silahkan lanjutkan ke halaman beranda.</p>
<form id="unlockForm" autocomplete="off">
<input id="password" type="password" placeholder="Password admin" autocomplete="current-password" required>
<button id="unlock" type="submit">🔐 Unlock</button>
</form>
<div id="status" class="status"></div>
<a class="back" href="/">← Kembali ke beranda</a>
</div>
<script>
const ENC_URL="admin.enc";
const form=document.getElementById("unlockForm");
const password=document.getElementById("password");
const button=document.getElementById("unlock");
const status=document.getElementById("status");
function b64ToBytes(value){const binary=atob(value.replace(/\s/g,""));const out=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)out[i]=binary.charCodeAt(i);return out;}
async function deriveKey(pass){const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pass));return crypto.subtle.importKey("raw",hash,{name:"AES-GCM"},false,["decrypt"]);}
async function decryptPage(data,pass){const raw=b64ToBytes(data);if(raw.length<29)throw new Error("Data admin tidak valid");const iv=raw.slice(0,12);const ciphertext=raw.slice(12);const key=await deriveKey(pass);const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ciphertext);return new TextDecoder().decode(plain);}
form.addEventListener("submit",async e=>{e.preventDefault();status.className="status";status.textContent="Membuka admin...";button.disabled=true;try{const response=await fetch(ENC_URL,{cache:"no-store"});if(!response.ok)throw new Error("File admin tidak ditemukan");const encrypted=await response.text();const html=await decryptPage(encrypted,password.value);document.open();document.write(html);document.close();}catch(err){console.error(err);status.className="status error";status.textContent="❌ Password salah atau file admin tidak valid.";button.disabled=false;password.select();}});
</script>
</body>
</html>
