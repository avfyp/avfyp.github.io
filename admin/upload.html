<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AVFYP Admin</title>

    <link rel="stylesheet" href="upload.css">
</head>

<body>

    <main class="admin-container">

        <h1>AVFYP Admin</h1>

        <p class="subtitle">
            Buat postingan video baru
        </p>


        <section class="form-card">

            <div class="field">

                <label for="title">
                    Judul Video
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Masukkan judul video"
                    autocomplete="off"
                >

            </div>


            <div class="field">

                <label for="slug">
                    Slug / URL
                </label>

                <input
                    type="text"
                    id="slug"
                    placeholder="judul-video"
                    autocomplete="off"
                >

                <small id="urlPreview">
                    https://avfyp.github.io/v/judul-video
                </small>

            </div>


            <div class="field">

                <label for="st">
                    Streamtape / ST
                </label>

                <input
                    type="url"
                    id="st"
                    placeholder="https://streamtape.com/..."
                    autocomplete="off"
                >

                <small>
                    Server utama
                </small>

            </div>


            <div class="field">

                <label for="gd">
                    Google Drive / GD
                </label>

                <input
                    type="url"
                    id="gd"
                    placeholder="https://drive.google.com/file/d/..."
                    autocomplete="off"
                >

                <small>
                    Opsional
                </small>

            </div>


            <div class="field">

                <label for="thumbnail">
                    Thumbnail
                </label>

                <div class="thumbnail-status" id="thumbnailStatus">
                    Otomatis dari ST jika tersedia
                </div>

                <input
                    type="url"
                    id="thumbnail"
                    placeholder="Kosongkan untuk otomatis"
                    autocomplete="off"
                >

                <small>
                    Bisa dikosongkan.
                    Sistem akan mencoba menggunakan thumbnail ST.
                </small>

            </div>


            <button
                id="uploadButton"
                class="upload-button"
            >
                Upload / Buat Video
            </button>

        </section>


        <section
            id="result"
            class="result-card"
            hidden
        >

            <h2>Video berhasil dibuat</h2>

            <p>
                File sudah dibuat. Simpan sebagai:
            </p>

            <div class="path-box" id="filePath">
                v/judul-video/index.html
            </div>

            <button
                id="downloadAgain"
                class="secondary-button"
            >
                Download Lagi
            </button>

        </section>

    </main>


    <script src="upload.js"></script>

</body>
</html>
