<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AVFYP Admin Upload</title>

    <link
        rel="stylesheet"
        href="/admin/css/upload.css"
    >
</head>

<body>

<main class="admin-container">

    <!-- HEADER -->
    <div class="admin-header">

        <div>
            <div class="logo">
                AVFYP
            </div>

            <h1>
                Upload Video
            </h1>

            <p>
                Tambah postingan baru ke website.
            </p>
        </div>

        <a
            href="/"
            class="home-button"
        >
            ← Home
        </a>

    </div>


    <!-- FORM -->
    <form id="uploadForm">

        <!-- PASSWORD -->
        <label>
            Password Admin

            <input
                type="password"
                id="adminKey"
                placeholder="Masukkan password admin"
                autocomplete="off"
                required
            >
        </label>


        <!-- TITLE -->
        <label>
            Judul Video

            <input
                type="text"
                id="title"
                placeholder="Judul video"
                maxlength="200"
                required
            >
        </label>


        <!-- SLUG -->
        <label>
            Slug URL

            <input
                type="text"
                id="slug"
                placeholder="judul-video"
                maxlength="80"
            >

            <small>
                Kosongkan untuk otomatis dibuat dari judul.
            </small>
        </label>


        <!-- DESCRIPTION -->
        <label>
            Deskripsi

            <textarea
                id="description"
                rows="4"
                maxlength="2000"
                placeholder="Deskripsi video..."
            ></textarea>
        </label>


        <!-- THUMBNAIL -->
        <label>
            Thumbnail URL

            <input
                type="url"
                id="thumbnail"
                placeholder="https://..."
            >

            <small>
                Opsional. Masukkan URL gambar thumbnail.
            </small>
        </label>


        <!-- SERVER -->
        <div class="server-box">

            <h2>
                Server Video
            </h2>

            <!-- STREAMTAPE -->
            <label>
                Streamtape (ST)

                <input
                    type="url"
                    id="st"
                    placeholder="https://..."
                >

                <small>
                    Server utama.
                </small>
            </label>


            <!-- GOOGLE DRIVE -->
            <label>
                Google Drive (GD)

                <input
                    type="url"
                    id="gd"
                    placeholder="https://drive.google.com/file/d/..."
                >

                <small>
                    Bisa menggunakan link Google Drive biasa.
                    Sistem akan mengubahnya menjadi link preview.
                </small>
            </label>


            <!-- VD -->
            <label>
                AVPLAYER (VD)

                <input
                    type="url"
                    id="vd"
                    placeholder="https://..."
                >

                <small>
                    Server video alternatif.
                </small>
            </label>

        </div>


        <!-- POPULAR -->
        <label class="checkbox">

            <input
                type="checkbox"
                id="popular"
            >

            <span>
                Masukkan ke Populer
            </span>

        </label>


        <!-- SUBMIT -->
        <button
            type="submit"
            id="uploadButton"
        >
            🚀 Upload Video
        </button>

    </form>


    <!-- STATUS -->
    <div
        id="status"
        class="status hidden"
    ></div>


    <!-- RESULT -->
    <div
        id="result"
        class="result hidden"
    ></div>

</main>


<!-- ADMIN JAVASCRIPT -->
<script src="/admin/js/upload.js"></script>

</body>
</html>
