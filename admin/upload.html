<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVFYP - Upload Video</title>
    <link rel="icon" type="image/png"
          href="/admin/thumbnail/favicon/avfyp.png">
    <link rel="stylesheet" href="css/upload.css">
</head>

<body>

    <div class="admin-container">

        <header class="admin-header">
            <a href="/" class="back-link">← Beranda</a>

            <h1>AVFYP Upload</h1>
            <p>Tambah postingan video baru</p>
        </header>


        <form id="uploadForm" autocomplete="off">

            <div class="form-group">
                <label for="adminKey">Password Admin</label>
                <input
                    type="password"
                    id="adminKey"
                    placeholder="Masukkan password admin"
                    required
                >
            </div>


            <div class="form-group">
                <label for="title">Judul Video</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Judul video"
                    maxlength="150"
                    required
                >
            </div>


            <div class="form-group">
                <label for="slug">Slug</label>
                <input
                    type="text"
                    id="slug"
                    placeholder="judul-video"
                    maxlength="80"
                >
                <small>Otomatis dibuat dari judul jika dikosongkan.</small>
            </div>


            <div class="form-group">
                <label for="description">Deskripsi</label>
                <textarea
                    id="description"
                    placeholder="Deskripsi video..."
                    rows="5"
                ></textarea>
            </div>


            <div class="form-group">
                <label for="thumbnail">Thumbnail URL</label>
                <input
                    type="url"
                    id="thumbnail"
                    placeholder="https://..."
                >
                <small>Opsional. Masukkan URL gambar thumbnail.</small>
            </div>


            <div class="server-box">

                <h2>Server Video</h2>

                <div class="form-group">
                    <label for="server1">SERVER1</label>
                    <input
                        type="url"
                        id="server1"
                        placeholder="https://..."
                    >
                    <small>Server pemutaran utama.</small>
                </div>

                <div class="form-group">
                    <label for="server2">SERVER2</label>
                    <input
                        type="url"
                        id="server2"
                        placeholder="https://..."
                    >
                    <small>Server pemutaran alternatif.</small>
                </div>

            </div>


            <label class="popular-option">
                <input type="checkbox" id="popular">
                <span>Masukkan ke Populer</span>
            </label>


            <div id="status" class="status hidden"></div>


            <button
                type="submit"
                id="uploadButton"
                class="upload-button"
            >
                🚀 Upload Video
            </button>


            <div id="result" class="result hidden"></div>

        </form>

    </div>


    <script src="js/upload.js"></script>

</body>
</html>
