<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AVFYP Admin Upload</title>

    <link rel="stylesheet" href="css/upload.css">
</head>

<body>

    <main class="admin-container">

        <header class="admin-header">
            <h1>AVFYP Admin</h1>
            <p>Upload video baru</p>
        </header>


        <section class="upload-card">

            <!-- ADMIN KEY -->

            <div class="form-group">
                <label for="adminKey">
                    Admin Key
                </label>

                <input
                    type="password"
                    id="adminKey"
                    placeholder="Masukkan Admin Key"
                    autocomplete="off"
                >
            </div>


            <!-- TITLE -->

            <div class="form-group">
                <label for="title">
                    Judul Video
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Judul video"
                >
            </div>


            <!-- SLUG -->

            <div class="form-group">
                <label for="slug">
                    Slug
                </label>

                <input
                    type="text"
                    id="slug"
                    placeholder="judul-video"
                >

                <small>
                    Otomatis dibuat dari judul. Bisa diedit manual.
                </small>
            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">
                <label for="description">
                    Deskripsi
                </label>

                <textarea
                    id="description"
                    placeholder="Deskripsi video..."
                ></textarea>
            </div>


            <!-- THUMBNAIL -->

            <div class="form-group">
                <label for="thumbnail">
                    Thumbnail URL
                </label>

                <input
                    type="url"
                    id="thumbnail"
                    placeholder="https://example.com/image.jpg"
                >

                <small>
                    Opsional.
                </small>
            </div>


            <!-- SERVER -->

            <div class="server-section">

                <div class="section-heading">
                    Server Video
                </div>


                <div class="form-group">
                    <label for="st">
                        ST
                    </label>

                    <input
                        type="url"
                        id="st"
                        placeholder="URL embed ST"
                    >
                </div>


                <div class="form-group">
                    <label for="gd">
                        GD
                    </label>

                    <input
                        type="url"
                        id="gd"
                        placeholder="https://drive.google.com/file/d/.../preview"
                    >
                </div>


                <div class="form-group">
                    <label for="vd">
                        VD
                    </label>

                    <input
                        type="url"
                        id="vd"
                        placeholder="URL embed VD"
                    >
                </div>


                <small>
                    Minimal satu server harus diisi.
                </small>

            </div>


            <!-- POPULAR -->

            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="popular"
                >

                <span>
                    Tandai sebagai populer
                </span>

            </label>


            <!-- SUBMIT -->

            <button
                type="button"
                id="uploadButton"
            >
                🚀 Upload Video
            </button>


            <!-- STATUS -->

            <div
                id="status"
                class="status"
            ></div>

        </section>

    </main>


    <script src="js/upload.js"></script>

</body>
</html>
