<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bokep Vandy Tanpa Sensor Percakapan Threesome Jilbab - AVFYP</title>

    <link
        rel="stylesheet"
        href="/css/video.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0d0d0d;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .video-page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 18px;
            color: #aaa;
            text-decoration: none;
            font-size: 15px;
        }

        .back:hover {
            color: #fff;
        }

        .video-title {
            margin: 0 0 15px;
            font-size: 20px;
            line-height: 1.3;
        }

        .video-description {
            margin: 18px 0;
            color: #aaa;
            line-height: 1.6;
        }

        .video-player {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        .video-player iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-empty {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }

        /* SERVER */

        .server-switcher {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 18px 0;
        }

        .server-btn {
            min-width: 130px;
            padding: 12px 20px;

            border: 1px solid #333;
            border-radius: 9px;

            background: #171717;
            color: #aaa;

            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .server-btn:hover {
            background: #222;
            color: #fff;
        }

        .server-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* VIEWS */

        .view-counter {
            text-align: center;
            margin: 15px 0 25px;

            color: #aaa;
            font-size: 16px;
        }

        #viewCount {
            color: #fff;
            font-weight: 600;
        }

        /* COMMENTS */

        .comments-section {
            width: 100%;
            max-width: 700px;
            margin: 35px auto;
        }

        .comments-section h2 {
            margin-bottom: 18px;
            font-size: 20px;
        }

        .comment-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .comment-form input,
        .comment-form textarea {
            display: block;
            width: 100%;
            padding: 12px 14px;

            border: 1px solid #333;
            border-radius: 8px;

            background: #151515;
            color: #fff;

            font-family: Arial, sans-serif;
            font-size: 16px;

            outline: none;
        }

        .comment-form input:focus,
        .comment-form textarea:focus {
            border-color: #777;
        }

        .comment-form textarea {
            min-height: 110px;
            resize: vertical;
        }

        .comment-form button {
            width: 100%;
            max-width: 220px;

            padding: 12px 18px;

            border: 0;
            border-radius: 8px;

            background: #fff;
            color: #000;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .comment-form button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .comments-list {
            margin-top: 25px;
        }

        .comment-item {
            padding: 14px 0;
            border-bottom: 1px solid #292929;
        }

        .comment-item strong {
            display: block;
            margin-bottom: 6px;
        }

        .comment-item p {
            margin: 0;
            color: #ccc;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .no-comments {
            padding: 20px;
            text-align: center;
            color: #777;
        }

        .comment-error {
            padding: 20px;
            text-align: center;
            color: #999;
        }

        /* POPULAR */

        .popular-section {
            margin: 45px 0 20px;
            padding-top: 25px;
            border-top: 1px solid #292929;
        }

        .popular-section h2 {
            margin-bottom: 20px;
        }

        .popular-grid {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 15px;
        }

        .popular-card {
            display: block;
            color: #fff;
            text-decoration: none;

            padding: 15px;

            border: 1px solid #292929;
            border-radius: 10px;

            background: #151515;
        }

        .popular-card:hover {
            background: #1d1d1d;
        }

        .popular-title {
            font-weight: 600;
            line-height: 1.4;
        }

        .popular-views {
            margin-top: 8px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 700px) {

            .video-page {
                padding: 16px;
            }

            .video-title {
                font-size: 18px;
            }

            .popular-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 450px) {

            .server-btn {
                flex: 1;
                min-width: 0;
            }

            .popular-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<main class="video-page">

    <a
        href="/"
        class="back"
    >
        ← Kembali ke Beranda
    </a>


    <h1 class="video-title">
        Bokep Vandy Tanpa Sensor Percakapan Threesome Jilbab
    </h1>


    <div class="video-player">

        
                <iframe
                    id="videoFrame"
                    src="https://streamtape.com/e/BB6dqLQ7MPIy1KL"
                    allowfullscreen
                    allow="autoplay; fullscreen; picture-in-picture"
                    loading="lazy"
                ></iframe>
              

    </div>


    <div class="server-switcher">

        
            <button
                class="server-btn active"
                data-url="https://streamtape.com/e/BB6dqLQ7MPIy1KL"
            >
                SERVER1
            </button>
        
            <button
                class="server-btn "
                data-url="https://drive.google.com/file/d/1U1JMJz0FoaCQOSCbtKfBizfCzk5TyM48/preview"
            >
                SERVER2
            </button>
        

    </div>


    <div class="view-counter">

        👁️ Total Views:
        <span id="viewCount">
            Memuat...
        </span>

    </div>


    <p class="video-description">
        
    </p>


    <!-- COMMENTS -->

    <section class="comments-section">

        <h2>
            💬 Komentar
        </h2>


        <form
            id="commentForm"
            class="comment-form"
        >

            <input
                type="text"
                id="commentName"
                placeholder="Nama pengirim"
                maxlength="50"
            >


            <textarea
                id="commentText"
                placeholder="Tulis komentar..."
                maxlength="500"
                required
            ></textarea>


            <button
                type="submit"
                id="commentButton"
            >
                Kirim Komentar
            </button>

        </form>


        <div
            id="commentsList"
            class="comments-list"
        >
            Memuat komentar...
        </div>

    </section>


    <!-- POPULAR -->

    <section class="popular-section">

        <h2>
            🔥 Populer
        </h2>


        <div
            id="popularGrid"
            class="popular-grid"
        >
            Memuat...
        </div>

    </section>


</main>


<script>

const WORKER_URL =
    "https://avfyp-upload.cntk-njay.workers.dev";

const slug =
    location.pathname
        .split("/")
        .filter(Boolean)
        .pop();


/* =========================================================
   SERVER SWITCH
========================================================= */

const frame =
    document.getElementById(
        "videoFrame"
    );


document
    .querySelectorAll(".server-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const url =
                    button.dataset.url;

                if (!url || !frame) {
                    return;
                }

                frame.src = url;

                document
                    .querySelectorAll(
                        ".server-btn"
                    )
                    .forEach(btn => {

                        btn.classList.remove(
                            "active"
                        );

                    });

                button.classList.add(
                    "active"
                );

            }
        );

    });


/* =========================================================
   VIEWS
========================================================= */

const viewCount =
    document.getElementById(
        "viewCount"
    );


async function loadViews() {

    try {

        const response =
            await fetch(
                WORKER_URL +
                "/api/views/" +
                encodeURIComponent(slug)
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        viewCount.textContent =
            Number(
                data.views || 0
            ).toLocaleString(
                "id-ID"
            );

    } catch (error) {

        console.error(
            "Views:",
            error
        );

        viewCount.textContent =
            "0";

    }

}


async function addView() {

    try {

        await fetch(
            WORKER_URL +
            "/api/views/" +
            encodeURIComponent(slug),
            {
                method: "POST"
            }
        );

        await loadViews();

    } catch (error) {

        console.error(
            "Add view:",
            error
        );

    }

}


loadViews();
addView();


setInterval(
    loadViews,
    10000
);


/* =========================================================
   COMMENTS
========================================================= */

const commentForm =
    document.getElementById(
        "commentForm"
    );

const commentName =
    document.getElementById(
        "commentName"
    );

const commentText =
    document.getElementById(
        "commentText"
    );

const commentButton =
    document.getElementById(
        "commentButton"
    );

const commentsList =
    document.getElementById(
        "commentsList"
    );


async function loadComments() {

    try {

        const response =
            await fetch(
                WORKER_URL +
                "/api/comments/" +
                encodeURIComponent(slug)
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        const comments =
            Array.isArray(data.comments)
                ? data.comments
                : [];


        commentsList.innerHTML = "";


        if (!comments.length) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "no-comments";

            empty.textContent =
                "Belum ada komentar.";

            commentsList.appendChild(
                empty
            );

            return;

        }


        comments.forEach(
            comment => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "comment-item";


                const name =
                    document.createElement(
                        "strong"
                    );

                name.textContent =
                    comment.name ||
                    "Anonim";


                const text =
                    document.createElement(
                        "p"
                    );

                text.textContent =
                    comment.comment ||
                    "";


                item.appendChild(name);
                item.appendChild(text);

                commentsList.appendChild(
                    item
                );

            }
        );

    } catch (error) {

        console.error(
            "Comments:",
            error
        );

        commentsList.textContent =
            "Gagal memuat komentar.";

    }

}


commentForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const name =
            commentName.value.trim() ||
            "Anonim";

        const comment =
            commentText.value.trim();


        if (!comment) {
            return;
        }


        commentButton.disabled =
            true;

        commentButton.textContent =
            "Mengirim...";


        try {

            const response =
                await fetch(
                    WORKER_URL +
                    "/api/comments/" +
                    encodeURIComponent(slug),
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                name,
                                comment
                            })
                    }
                );


            let data = {};

            try {

                data =
                    await response.json();

            } catch {

                data = {};

            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Gagal mengirim komentar"
                );

            }


            commentName.value =
                "";

            commentText.value =
                "";


            await loadComments();


        } catch (error) {

            console.error(
                "Comment:",
                error
            );

            alert(
                error.message ||
                "Gagal mengirim komentar"
            );

        } finally {

            commentButton.disabled =
                false;

            commentButton.textContent =
                "Kirim Komentar";

        }

    }
);


loadComments();


/* =========================================================
   POPULAR
========================================================= */

const popularGrid =
    document.getElementById(
        "popularGrid"
    );


async function loadPopular() {

    try {

        const response =
            await fetch(
                WORKER_URL +
                "/api/popular"
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        const posts =
            Array.isArray(data.posts)
                ? data.posts
                : [];


        popularGrid.innerHTML =
            "";


        if (!posts.length) {

            popularGrid.textContent =
                "Belum ada posting populer.";

            return;

        }


        posts.forEach(
            post => {

                const card =
                    document.createElement(
                        "a"
                    );

                card.className =
                    "popular-card";

                card.href =
                    "/v/" +
                    post.slug +
                    "/";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "popular-title";

                title.textContent =
                    post.title ||
                    "Tanpa judul";


                const views =
                    document.createElement(
                        "div"
                    );

                views.className =
                    "popular-views";

                views.textContent =
                    "👁️ " +
                    Number(
                        post.views || 0
                    ).toLocaleString(
                        "id-ID"
                    ) +
                    " views";


                card.appendChild(title);

                card.appendChild(views);

                popularGrid.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(
            "Popular:",
            error
        );

        popularGrid.textContent =
            "Gagal memuat populer.";

    }

}


loadPopular();

</script>

</body>

</html>
